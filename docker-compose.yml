services:
  server:
    image: ghcr.io/<owner>/aas-live-server:latest
    env_file: ./server/.env
    ports: ["3001:3001"]
    restart: unless-stopped
    labels: ["com.centurylabs.watchtower.enable=true"]

  client:
    image: ghcr.io/<owner>/aas-live-client:latest
    ports: ["80:80"]
    depends_on: [server]
    restart: unless-stopped
    labels: ["com.centurylabs.watchtower.enable=true"]

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
    restart: unless-stopped
