name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  guard-env-files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Comprobar que no hay archivos .env versionados
        run: |
          matches=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$matches" ]; then
            echo "❌ Archivos .env versionados en el repositorio:"
            echo "$matches"
            exit 1
          fi
          echo "✅ Ningún archivo .env está versionado."
