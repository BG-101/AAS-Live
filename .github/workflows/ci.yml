name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  guard-env-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Comprobar que no hay archivos .env versionados
        run: |
          matches=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$matches" ]; then
            echo "❌ Archivos .env versionados en el repositorio:"
            echo "$matches"
            exit 1
          fi
          echo "✅ Ningún archivo .env está versionado."
