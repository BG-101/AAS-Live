name: Build & Push Docker Images

on:
  release:
    types: [published]

env:
  # Namespace único y en minúsculas para ambos paquetes
  IMAGE_NAMESPACE: bg-101

jobs:
  build-and-push:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/aas-live-server:latest
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/aas-live-server:${{ github.event.release.tag_name }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/aas-live-client:latest
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/aas-live-client:${{ github.event.release.tag_name }}
