name: Build & Push Docker Images

on:
  release:
    types: [published]

env:
  # Namespace único y en minúsculas para ambos paquetes
  IMAGE_NAMESPACE: bg-101

jobs:
  build-and-push:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derivar versión sin prefijo "v"
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/aas-live-server:latest
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/aas-live-server:${{ github.event.release.tag_name }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./client
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/aas-live-client:latest
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/aas-live-client:${{ github.event.release.tag_name }}
