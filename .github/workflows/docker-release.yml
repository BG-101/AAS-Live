name: Build & Push Docker Images

on:
  release:
    types: [published]

env:
  # Namespace único y en minúsculas para ambos paquetes
  IMAGE_NAMESPACE: bg-101

jobs:
  build-and-push:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/aas-live-server:latest
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/aas-live-server:${{ github.event.release.tag_name }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/aas-live-client:latest
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/aas-live-client:${{ github.event.release.tag_name }}
