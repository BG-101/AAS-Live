name: Build & Push Docker Images

on:
  release:
    types: [published]

jobs:
  build-auth-push:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aas-live-server:latest
            ghcr.io/${{ github.repository_owner }}/aas-live-server:${{ github.event.release.tag_name }}

      - uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aas-live-client:latest
            ghcr.io/${{ github.repository_owner }}/aas-live-client:${{ github.event.release.tag_name }}
